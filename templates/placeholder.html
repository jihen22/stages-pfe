{% extends "base_app.html" %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-9 col-lg-7">
    <div class="card text-center">
      <div class="card-body p-5">
        <div class="dashboard-icon text-secondary mb-3"><i class="bi bi-{{ icon|default:'tools' }}"></i></div>
        <h1 class="h3">{{ title }}</h1>
        <p class="text-muted">{{ subtitle }}</p>
        <span class="badge text-bg-info"><i class="bi bi-hourglass-split"></i> Bientôt disponible</span>
        <div class="mt-4">
          <a href="{% url 'accounts:dashboard' %}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Retour au tableau de bord
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
