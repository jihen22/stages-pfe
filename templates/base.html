{% load static %}
<!doctype html>
<html lang="fr" data-bs-theme="light" data-theme="AUTO" data-accent="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Plateforme Stages &amp; PFE{% endblock %}</title>
  <meta name="csrf-token" content="{{ csrf_token }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">

  {# Apply the saved theme before first paint to avoid a flash of the wrong theme. #}
  <script>
    (function () {
      var root = document.documentElement;
      var THEME_KEY = 'sgi-theme';
      var ACCENT_KEY = 'sgi-accent';
      var serverTheme = '{{ user.theme|default:"" }}';
      var serverAccent = '{{ user.accent|default:"" }}';
      var theme = serverTheme || localStorage.getItem(THEME_KEY) || 'AUTO';
      var accent = serverAccent || localStorage.getItem(ACCENT_KEY) || 'BLUE';
      function resolve(value) {
        if (value === 'AUTO') {
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        return String(value).toLowerCase();
      }
      root.setAttribute('data-theme', theme);
      root.setAttribute('data-bs-theme', resolve(theme));
      root.setAttribute('data-accent', String(accent).toLowerCase());
    })();
  </script>

  {% block extra_head %}{% endblock %}
</head>
<body data-authenticated="{{ user.is_authenticated|yesno:'1,0' }}"
      data-set-theme-url="{% url 'accounts:set_theme' %}">
  {% block layout %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/app.js' %}"></script>
  <script src="{% static 'js/theme.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
